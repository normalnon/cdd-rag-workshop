[project]
name = "cdd-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.11",
    "huggingface-hub>=2.0.0",
    "ipykernel>=7.3.0",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.6",
    "openai>=3.19.2",
    "pandas>=3.0.6",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "pythainlp>=5.3.8",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdd_rag"]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
